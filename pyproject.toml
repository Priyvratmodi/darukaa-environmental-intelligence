[project]
name = "project"
version = "0.1.0"
description = ""
authors = [
    {name = "priyvratmodi",email = "modipriyvrat2@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0.0"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)",
    "langchain (>=1.4.1,<2.0.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "langchain-openai (>=1.6.2,<2.0.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "qdrant-client (>=1.19.1,<2.0.0)",
    "langchain-qdrant (>=1.1.0,<2.0.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "fastembed (>=0.8.0,<0.9.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn (>=0.30.0,<1.0.0)"
]

[tool.poetry]
packages = [{include = "project", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
